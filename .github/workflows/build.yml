name: Build Zaynix Inject IPA (Fixed Bundle)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. PERBAIKAN: Memaksa ekstraksi file zip sumber ke root folder
      - name: Unzip Source Project Files
        run: |
          unzip -o "OGIOS - SOURCE FULL.zip" -d ./
          ls -la # Cek apakah file sudah keluar di folder utama

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 2. PERBAIKAN: Mengubah Bundle ID dan nama aplikasi murni langsung ke file project
      - name: Inject Custom Name and Bundle ID
        run: |
          find . -name "Info.plist" -exec sed -i '' 's/com.apple.mobile.MobileStoreInAppSheet/com.apple.mobile.MobileHouseArrest/g' {} + || true
          find . -name "project.pbxproj" -exec sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.apple.mobile.MobileHouseArrest;/g' {} + || true
          find . -name "Info.plist" -exec sed -i '' 's/ThreeOneOSFive/Zaynix Inject/g' {} + || true

      # 3. MENJALANKAN SCRIPT BAWAAN UTAMA
      - name: Execute Shell Build Compile
        run: |
          chmod +x ./build_unsigned.sh ./build_esign_ready_ipa.sh || true
          ./build_unsigned.sh || sh build_unsigned.sh
          ./build_esign_ready_ipa.sh build/Zaynix-Inject-unsigned.ipa || sh build_esign_ready_ipa.sh build/Zaynix-Inject-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Inject-Signed-Ready
          path: build/Zaynix-Inject-unsigned.ipa
          
